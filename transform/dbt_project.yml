name: pits_transform
version: "0.1.0"
config-version: 2
profile: pits_transform

# Telemetry off (D85). DO_NOT_TRACK=1 is also set by the CLI wrapper (D88).
flags:
  send_anonymous_usage_stats: false

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]

# D128: the RUNT mapping fails the build when the vehicles of the latest publication without a DANE
# code (all statuses) exceed this share; any unmatched pair below it only warns.
vars:
  dane_unmatched_vehicle_share_max: 0.01

models:
  pits_transform:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts

# D126: versioned, reviewed RUNT -> DANE exceptions. Seeds live in staging (the transformer owns
# it). Every column is text: without it dbt would read the code 05237 as the number 5237.
# Tags are set per seed in seeds/_seeds.yml, NOT here: dbt tags are additive across levels, so a
# project-wide +tags would also tag the D139 regional seeds with vehicle_fleet/divipola and a
# test depending on both families would run in both builds. The RUNT/DIVIPOLA seeds carry
# [vehicle_fleet, divipola] and the regional seeds only [fleet_brand] (D139).
seeds:
  pits_transform:
    +schema: staging
    runt_municipality_dane_exception:
      +column_types:
        department_name_norm: text
        municipality_name_norm: text
        dane_municipality_code: text
        dane_municipality_name: text
        reason: text
        decision_id: text
    # D133: vehicle_class -> vehicle_group; classifies only, never filters.
    vehicle_class_demand_scope:
      +column_types:
        vehicle_class_norm: text
        vehicle_group: text
        decision_id: text
    # D139: regional brand/line seeds (tag fleet_brand only, see seeds/_seeds.yml). Every column
    # is text so that department codes such as 15 stay strings.
    regional_brand_source:
      +column_types:
        source_system: text
        dane_department_code: text
        decision_id: text
    regional_vehicle_class_map:
      +column_types:
        source_system: text
        source_class_norm: text
        vehicle_class_norm: text
        decision_id: text
    brand_alias:
      +column_types:
        source_brand_norm: text
        brand_norm: text
        decision_id: text
    auteco_line_brand_map:
      +column_types:
        line_norm: text
        real_brand: text
        evidence: text
        decision_id: text
