version: 2

models:
  - name: fct_fx_rate_daily
    description: "Daily FX rates (grain: rate_date + currency pair); contract for BI. Same 7 columns as landing.fx_rate."
    config:
      tags: [fx_rate]
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [rate_date, currency_from, currency_to]
    columns:
      - name: rate_date
        description: "Calendar day the rate applies to."
        data_tests:
          - not_null
      - name: currency_from
        description: "ISO 4217 code of the base currency (1 unit of this currency)."
        data_tests:
          - not_null
      - name: currency_to
        description: "ISO 4217 code of the quoted currency."
        data_tests:
          - not_null
      - name: rate
        description: "Units of currency_to per 1 currency_from, exactly as published (no rounding)."
        data_tests:
          - not_null
      - name: source_system
        description: "Source the rate came from."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['superfinanciera_trm']
      - name: source_reference
        description: "Raw object path/row the rate came from (lineage to raw)."
        data_tests:
          - not_null
      - name: load_id
        description: "ops.load_run row that last wrote this rate."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: source('ops', 'load_run')
                field: load_id

  - name: fct_vehicle_fleet_snapshot
    description: "Vehicle fleet stock (grain: publication + department + municipality + service + status + class + registration year); contract for BI. All publications, statuses and services (D100)."
    config:
      tags: [vehicle_fleet]
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [publication_year, publication_month, department_name, municipality_name, service_name, vehicle_status, vehicle_class, registration_year]
    columns:
      - name: publication_year
        description: "Year of the publication (snapshot month)."
        data_tests:
          - not_null
      - name: publication_month
        description: "Month (1-12) of the publication."
        data_tests:
          - not_null
      - name: department_name
        description: "Department as published (may be truncated at source; not corrected)."
        data_tests:
          - not_null
      - name: municipality_name
        description: "Municipality as published."
        data_tests:
          - not_null
      - name: service_name
        description: "Service type as published."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['NO REGISTRA', 'OFICIAL', 'OTROS', 'PARTICULAR', 'PÚBLICO']
              config:
                severity: error
      - name: vehicle_status
        description: "Vehicle status as published."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['ACTIVO', 'INCONSISTENTE']
              config:
                severity: error
      - name: vehicle_class
        description: "Vehicle class as published."
        data_tests:
          - not_null
      - name: registration_year
        description: "Registration year of the vehicles in the cell."
        data_tests:
          - not_null
      - name: vehicle_count
        description: "Vehicles in the cell at the publication date (stock, rule 5)."
        data_tests:
          - not_null
      - name: source_system
        description: "Source the snapshot came from."
        data_tests:
          - not_null
      - name: source_reference
        description: "Raw object path/row index (lineage to raw)."
        data_tests:
          - not_null
      - name: load_id
        description: "ops.load_run row that wrote this publication."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: source('ops', 'load_run_fleet')
                field: load_id
      - name: department_name_norm
        description: "department_name upper-cased, accents removed, spaces collapsed (D100)."
        data_tests:
          - not_null
      - name: municipality_name_norm
        description: "municipality_name, same normalization (D100)."
        data_tests:
          - not_null
      - name: vehicle_class_norm
        description: "vehicle_class, same normalization (D100)."
        data_tests:
          - not_null

  - name: dim_municipality
    description: "DANE municipality dimension (grain: one row per 5-digit DIVIPOLA code), current snapshot (D125). Coordinates are typed but not used by any demand mart."
    config:
      tags: [divipola]
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [department_name_norm, municipality_name_norm]
    columns:
      - name: dane_municipality_code
        description: "5-digit DANE municipality code."
        data_tests: [not_null, unique]
      - name: dane_department_code
        description: "2-digit DANE department code (first two digits of the municipality code)."
        data_tests: [not_null]
      - name: department_name
        description: "Department as published by DANE (with accents)."
        data_tests: [not_null]
      - name: municipality_name
        description: "Municipality as published by DANE (with accents)."
        data_tests: [not_null]
      - name: department_name_norm
        description: "department_name normalized with the D100 macro."
        data_tests: [not_null]
      - name: municipality_name_norm
        description: "municipality_name normalized with the D100 macro."
        data_tests: [not_null]
      - name: municipality_type
        description: "Municipio, Isla or Área no municipalizada."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Municipio', 'Isla', 'Área no municipalizada']
              config:
                severity: error
      - name: longitude
        description: "Decimal degrees, numeric."
        data_tests: [not_null]
      - name: latitude
        description: "Decimal degrees, numeric."
        data_tests: [not_null]
      - name: load_id
        description: "ops.load_run row that wrote the snapshot."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: source('ops', 'load_run_divipola')
                field: load_id

  - name: map_runt_municipality_dane
    description: "RUNT (department, municipality) pair -> DANE municipality code (grain: one row per normalized pair seen in any publication). Curated exceptions (seed) first, then the automatic match on normalized names; no fuzzy rules (D126). A pair without a code keeps a NULL code and is policed by the coverage tests (D128)."
    config:
      tags: [vehicle_fleet, divipola]
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [department_name_norm, municipality_name_norm]
    columns:
      - name: department_name_norm
        description: "RUNT nombre_departamento normalized with the D100 macro."
        data_tests: [not_null]
      - name: municipality_name_norm
        description: "RUNT nombre_municipio normalized with the D100 macro."
        data_tests: [not_null]
      - name: dane_municipality_code
        description: "5-digit DANE code, or NULL when neither the exception seed nor the automatic match found one."
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_municipality')
                field: dane_municipality_code
      - name: dane_department_code
        description: "2-digit DANE department code (first two digits of the municipality code)."
      - name: match_method
        description: "auto_norm (normalized names equal), curated (exception seed) or NULL (no code)."
        data_tests:
          - accepted_values:
              arguments:
                values: ['auto_norm', 'curated']
              config:
                severity: error
      - name: exception_reason
        description: "Reason of the exception row when the pair is in the seed, else NULL."

  - name: fct_vehicle_fleet_snapshot_dane
    description: "fct_vehicle_fleet_snapshot (same grain, same rows) plus the DANE municipality code; unmatched cells keep NULL dane_* columns (D127). The D100 fct is not modified."
    config:
      tags: [vehicle_fleet, divipola]
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [publication_year, publication_month, department_name, municipality_name, service_name, vehicle_status, vehicle_class, registration_year]
    columns:
      - name: publication_year
        description: "Year of the publication (snapshot month)."
        data_tests: [not_null]
      - name: publication_month
        description: "Month (1-12) of the publication."
        data_tests: [not_null]
      - name: department_name
        description: "Department as published by the RUNT."
        data_tests: [not_null]
      - name: municipality_name
        description: "Municipality (registration office seat, an inference) as published by the RUNT."
        data_tests: [not_null]
      - name: service_name
        description: "Service type as published."
        data_tests: [not_null]
      - name: vehicle_status
        description: "Vehicle status as published."
        data_tests: [not_null]
      - name: vehicle_class
        description: "Vehicle class as published."
        data_tests: [not_null]
      - name: registration_year
        description: "Registration year of the vehicles in the cell."
        data_tests: [not_null]
      - name: vehicle_count
        description: "Vehicles in the cell at the publication date (stock, rule 5)."
        data_tests: [not_null]
      - name: source_system
        description: "Source the snapshot came from."
        data_tests: [not_null]
      - name: source_reference
        description: "Raw object path/row index (lineage to raw)."
        data_tests: [not_null]
      - name: load_id
        description: "ops.load_run row that wrote this publication."
        data_tests: [not_null]
      - name: department_name_norm
        description: "department_name normalized (D100)."
        data_tests: [not_null]
      - name: municipality_name_norm
        description: "municipality_name normalized (D100)."
        data_tests: [not_null]
      - name: vehicle_class_norm
        description: "vehicle_class normalized (D100)."
        data_tests: [not_null]
      - name: dane_municipality_code
        description: "5-digit DANE municipality code, NULL when unmatched."
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_municipality')
                field: dane_municipality_code
      - name: dane_department_code
        description: "2-digit DANE department code, NULL when unmatched."
      - name: dane_match_method
        description: "auto_norm, curated, or NULL when unmatched."

  - name: fct_parts_demand_fleet
    description: "Active vehicle fleet (stock, not a count of parts) by REGISTRATION municipality (the RUNT office seat, not where the vehicle runs), service, class and registration year; the demand base for spare parts (D132). Only ACTIVO vehicles of PARTICULAR and PÚBLICO service; all classes, grouped by vehicle_group (D133); all publications. Pairs without DANE code keep NULL codes."
    config:
      tags: [vehicle_fleet, divipola, parts_demand]
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [publication_year, publication_month, department_name_norm, municipality_name_norm, service_name, vehicle_class_norm, registration_year]
    columns:
      - name: publication_year
        description: "Year of the publication (snapshot month)."
        data_tests: [not_null]
      - name: publication_month
        description: "Month (1-12) of the publication."
        data_tests: [not_null]
      - name: department_name_norm
        description: "RUNT department normalized (D100)."
        data_tests: [not_null]
      - name: municipality_name_norm
        description: "RUNT registration municipality normalized (D100)."
        data_tests: [not_null]
      - name: service_name
        description: "Service type as published (PARTICULAR or PÚBLICO)."
        data_tests: [not_null]
      - name: vehicle_class_norm
        description: "Vehicle class normalized (D100); CAMION and CAMIÓN are one key."
        data_tests: [not_null]
      - name: registration_year
        description: "Registration year as published (RUNT sentinels 1900 and 1901 kept)."
        data_tests: [not_null]
      - name: dane_department_code
        description: "2-digit DANE department code, NULL when unmatched."
      - name: dane_municipality_code
        description: "5-digit DANE municipality code, NULL when unmatched (D128)."
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_municipality')
                field: dane_municipality_code
      - name: dane_match_method
        description: "auto_norm, curated, or NULL when unmatched."
      - name: demand_segment
        description: "particular (PARTICULAR service) or fleet (PÚBLICO service) (D54, D56)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['particular', 'fleet']
      - name: vehicle_group
        description: "Group of the class from the D133 seed; unmapped when the class is not in it."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['car', 'motorcycle', 'heavy', 'trailer', 'machinery', 'other', 'unmapped']
      - name: active_vehicle_count
        description: "Active vehicles in the cell at the publication date (stock, rule 5)."
        data_tests: [not_null]
      - name: load_id
        description: "ops.load_run row that wrote the publication."
        data_tests: [not_null]

  - name: fct_parts_demand_scope
    description: "Vehicles per publication and scope_status: included in fct_parts_demand_fleet or the reason they are excluded (D134). The sum of all statuses equals the staging total of the publication."
    config:
      tags: [vehicle_fleet, divipola, parts_demand]
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [publication_year, publication_month, scope_status]
    columns:
      - name: publication_year
        description: "Year of the publication (snapshot month)."
        data_tests: [not_null]
      - name: publication_month
        description: "Month (1-12) of the publication."
        data_tests: [not_null]
      - name: scope_status
        description: "included or the first exclusion that applies (status first, then service)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['included', 'excluded_status_inconsistente', 'excluded_service_oficial', 'excluded_service_otros', 'excluded_service_no_registra']
      - name: vehicle_count
        description: "Vehicles in that status at the publication date (stock, rule 5)."
        data_tests: [not_null]
