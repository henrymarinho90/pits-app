version: 2

sources:
  - name: landing
    schema: landing
    tables:
      - name: fx_rate
        description: "Daily FX rates as normalized by the loader (D79, D81)."
        data_tests:
          - unique_combination_of_columns:
              arguments:
                combination_of_columns: [rate_date, currency_from, currency_to]
        columns:
          - name: rate_date
            data_tests:
              - not_null
          - name: currency_from
            data_tests:
              - not_null
          - name: currency_to
            data_tests:
              - not_null
          - name: rate
            data_tests:
              - not_null
          - name: source_system
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['superfinanciera_trm']
          - name: source_reference
            data_tests:
              - not_null
          - name: load_id
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('ops', 'load_run')
                    field: load_id

  - name: ops
    schema: ops
    tables:
      - name: load_run
        description: "Audit of effective loads into landing (D81)."
        config:
          loaded_at_field: loaded_at
          freshness:
            warn_after: {count: 2, period: day}
            error_after: {count: 7, period: day}
            filter: "dataset = 'fx_rate'"
