version: 2

# The tests below repeat the source tests on purpose: if they fail on this view, dbt skips
# fct_fx_rate_daily, so the previous mart stays intact (build order: test before dependents).
models:
  - name: stg_fx_rate
    description: "Daily FX rates, 1:1 view over landing.fx_rate (no derived columns)."
    config:
      tags: [fx_rate]
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [rate_date, currency_from, currency_to]
    columns:
      - name: rate_date
        description: "Calendar day the rate applies to."
        data_tests:
          - not_null
      - name: currency_from
        description: "ISO 4217 code of the base currency (1 unit of this currency)."
        data_tests:
          - not_null
      - name: currency_to
        description: "ISO 4217 code of the quoted currency."
        data_tests:
          - not_null
      - name: rate
        description: "Units of currency_to per 1 currency_from, exactly as published (no rounding)."
        data_tests:
          - not_null
      - name: source_system
        description: "Source the rate came from."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['superfinanciera_trm']
      - name: source_reference
        description: "Raw object path/row the rate came from (lineage to raw)."
        data_tests:
          - not_null
      - name: load_id
        description: "ops.load_run row that last wrote this rate."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: source('ops', 'load_run')
                field: load_id

  - name: stg_vehicle_fleet_snapshot
    description: "Vehicle fleet snapshot: landing columns as published plus normalized keys (D100). Repeats the source tests on purpose: a failure skips the mart."
    config:
      tags: [vehicle_fleet]
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [publication_year, publication_month, department_name, municipality_name, service_name, vehicle_status, vehicle_class, registration_year]
    columns:
      - name: publication_year
        description: "Year of the publication (snapshot month)."
        data_tests:
          - not_null
      - name: publication_month
        description: "Month (1-12) of the publication."
        data_tests:
          - not_null
      - name: department_name
        description: "Department as published (may be truncated at source; not corrected)."
        data_tests:
          - not_null
      - name: municipality_name
        description: "Municipality as published."
        data_tests:
          - not_null
      - name: service_name
        description: "Service type as published."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['NO REGISTRA', 'OFICIAL', 'OTROS', 'PARTICULAR', 'PÚBLICO']
              config:
                severity: error
      - name: vehicle_status
        description: "Vehicle status as published."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['ACTIVO', 'INCONSISTENTE']
              config:
                severity: error
      - name: vehicle_class
        description: "Vehicle class as published."
        data_tests:
          - not_null
      - name: registration_year
        description: "Registration year of the vehicles in the cell."
        data_tests:
          - not_null
      - name: vehicle_count
        description: "Vehicles in the cell at the publication date (stock, rule 5)."
        data_tests:
          - not_null
      - name: source_system
        description: "Source the snapshot came from."
        data_tests:
          - not_null
      - name: source_reference
        description: "Raw object path/row index (lineage to raw)."
        data_tests:
          - not_null
      - name: load_id
        description: "ops.load_run row that wrote this publication."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: source('ops', 'load_run_fleet')
                field: load_id
      - name: department_name_norm
        description: "department_name upper-cased, accents removed, spaces collapsed (D100)."
        data_tests:
          - not_null
      - name: municipality_name_norm
        description: "municipality_name, same normalization (D100)."
        data_tests:
          - not_null
      - name: vehicle_class_norm
        description: "vehicle_class, same normalization (D100)."
        data_tests:
          - not_null

  - name: stg_divipola_municipality
    description: "DIVIPOLA municipalities: landing columns as published, numeric coordinates and normalized join keys (D125). Repeats the source tests on purpose: a failure skips the dimension."
    config:
      tags: [divipola]
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [department_code, municipality_name]
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [department_name_norm, municipality_name_norm]
    columns:
      - name: department_code
        description: "2-digit DANE department code."
        data_tests: [not_null]
      - name: department_name
        description: "Department as published (with accents)."
        data_tests: [not_null]
      - name: municipality_code
        description: "5-digit DANE municipality code (department code + 3 digits)."
        data_tests: [not_null, unique]
      - name: municipality_name
        description: "Municipality as published (with accents)."
        data_tests: [not_null]
      - name: municipality_type
        description: "Municipio, Isla or Área no municipalizada."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Municipio', 'Isla', 'Área no municipalizada']
              config:
                severity: error
      - name: longitude
        description: "Decimal degrees (published with a decimal comma)."
        data_tests: [not_null]
      - name: latitude
        description: "Decimal degrees (published with a decimal comma)."
        data_tests: [not_null]
      - name: source_system
        description: "Source the snapshot came from."
        data_tests: [not_null]
      - name: source_reference
        description: "Raw object path/row index (lineage to raw)."
        data_tests: [not_null]
      - name: load_id
        description: "ops.load_run row that wrote this snapshot."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: source('ops', 'load_run_divipola')
                field: load_id
      - name: department_name_norm
        description: "department_name upper-cased, accents removed, spaces collapsed (D100 macro)."
        data_tests: [not_null]
      - name: municipality_name_norm
        description: "municipality_name, same normalization."
        data_tests: [not_null]

  - name: stg_regional_fleet_brand
    description: "Regional vehicle counts: landing columns as published plus normalized keys (D100), the resolved brand (alias, then AUTECO line map, D139) and the calibration scope. Repeats the source tests on purpose: a failure skips the marts."
    config:
      tags: [fleet_brand]
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [source_system, vehicle_class, brand, line, service_name, vehicle_status]
    columns:
      - name: source_system
        description: "Departmental source of the snapshot."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['gobernacion_boyaca_parque_automotor', 'gobernacion_risaralda_parque_automotor']
              config:
                severity: error
      - name: rows_updated
        description: "UTC date of the rowsUpdatedAt of the source snapshot."
        data_tests: [not_null]
      - name: vehicle_class
        description: "Class as published."
        data_tests: [not_null]
      - name: brand
        description: "Brand as published (AUTECO prefixes and the distributor name included)."
        data_tests: [not_null]
      - name: line
        description: "Line as published."
        data_tests: [not_null]
      - name: service_name
        description: "Service as published; NULL when the source does not publish it (Risaralda)."
      - name: vehicle_status
        description: "Status as published; NULL when the source does not publish it (Risaralda)."
      - name: vehicle_count
        description: "Vehicles in the group (stock, rule 5)."
        data_tests: [not_null]
      - name: source_reference
        description: "Raw manifest the counts were aggregated from (lineage to raw)."
        data_tests: [not_null]
      - name: load_id
        description: "ops.load_run row that wrote the snapshot."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: source('ops', 'load_run_brand')
                field: load_id
      - name: vehicle_class_norm
        description: "vehicle_class normalized (D100)."
        data_tests: [not_null]
      - name: source_brand_norm
        description: "brand normalized (D100), before alias and AUTECO resolution."
        data_tests: [not_null]
      - name: line_norm
        description: "line normalized (D100)."
        data_tests: [not_null]
      - name: service_name_norm
        description: "service_name normalized (D100); NULL for Risaralda."
      - name: vehicle_status_norm
        description: "vehicle_status normalized (D100); NULL for Risaralda."
      - name: brand_norm
        description: "Resolved brand: alias, then the AUTECO line map; never AUTECO (SIN ASIGNAR when unknown)."
        data_tests: [not_null]
      - name: brand_resolution
        description: "How brand_norm was obtained."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['as_published', 'alias', 'auteco_map', 'auteco_unmapped']
      - name: brand_evidence
        description: "Evidence of the AUTECO line map row (dato, inferencia, sin_evidencia); NULL otherwise."
      - name: calibration_class_norm
        description: "RUNT vehicle_class_norm from the class map, 'excluded', or 'unmapped'."
        data_tests: [not_null]
      - name: scope_status
        description: "included, or the reason the group is out of the calibration."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['included', 'excluded_class', 'excluded_status', 'excluded_service']
