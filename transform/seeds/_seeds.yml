version: 2

seeds:
  - name: runt_municipality_dane_exception
    description: "RUNT (department, municipality) pairs whose normalized names do not match DIVIPOLA, with the DANE code Henry approved (D126). Takes precedence over the automatic match. A pair that does not exist in DIVIPOLA goes here with an empty code and reason not_in_divipola (D128)."
    config:
      tags: [vehicle_fleet, divipola]
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [department_name_norm, municipality_name_norm]
    columns:
      - name: department_name_norm
        description: "RUNT nombre_departamento normalized with the D100 macro (the join key)."
        data_tests: [not_null]
      - name: municipality_name_norm
        description: "RUNT nombre_municipio normalized with the D100 macro (the join key)."
        data_tests: [not_null]
      - name: dane_municipality_code
        description: "5-digit DANE municipality code; empty only when reason is not_in_divipola."
      - name: dane_municipality_name
        description: "DIVIPOLA name of that code, for the reviewer; checked against the dimension (warn)."
      - name: reason
        description: "Why the pair is an exception."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['official_name_differs', 'not_in_divipola']
      - name: decision_id
        description: "Decision that approved the row."
        data_tests: [not_null]

  - name: vehicle_class_demand_scope
    description: "One row per real RUNT vehicle_class_norm with the vehicle_group Henry approved (D133). It only classifies, it never filters: every class enters the parts-demand mart; a class missing here shows as 'unmapped' and warns."
    config:
      tags: [vehicle_fleet, divipola]
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [vehicle_class_norm]
    columns:
      - name: vehicle_class_norm
        description: "RUNT vehicle_class normalized with the D100 macro (the join key)."
        data_tests: [not_null]
      - name: vehicle_group
        description: "Coarse group of the class (inference reviewed by Henry in the PR)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['car', 'motorcycle', 'heavy', 'trailer', 'machinery', 'other']
      - name: decision_id
        description: "Decision that approved the row."
        data_tests: [not_null]

  # ---- D139: regional brand/line share (tag fleet_brand ONLY: no test may also depend on a
  # vehicle_fleet/divipola node, because dbt selection is eager).
  - name: regional_brand_source
    description: "Regional source_system -> DANE department code whose RUNT fleet weights the pooled regional shares (D140). 15 = BOYACA, 66 = RISARALDA (verified against fct_parts_demand_fleet). Attribution: Gobernacion de Boyaca em3d-hmim / Gobernacion de Risaralda x9pp-pcn5, CC BY-SA 4.0 (docs 08, ficha 9)."
    config:
      tags: [fleet_brand]
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [source_system]
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [dane_department_code]
    columns:
      - name: source_system
        description: "source_system of landing.regional_fleet_brand_count."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['gobernacion_boyaca_parque_automotor', 'gobernacion_risaralda_parque_automotor']
      - name: dane_department_code
        description: "2-digit DANE department code (text)."
        data_tests: [not_null]
      - name: decision_id
        description: "Decision that approved the row."
        data_tests: [not_null]

  - name: regional_vehicle_class_map
    description: "Regional vehicle class (normalized) -> RUNT vehicle_class_norm, or 'excluded' when the class is out of the calibration (D139). Approved mapping (inference reviewed in the PR); a class not listed is 'unmapped' and warns. Attribution of the regional sources: Gobernacion de Boyaca em3d-hmim / Gobernacion de Risaralda x9pp-pcn5, CC BY-SA 4.0 (docs 08, ficha 9)."
    config:
      tags: [fleet_brand]
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [source_system, source_class_norm]
    columns:
      - name: source_system
        description: "source_system of landing.regional_fleet_brand_count."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['gobernacion_boyaca_parque_automotor', 'gobernacion_risaralda_parque_automotor']
      - name: source_class_norm
        description: "Class as the region publishes it, normalized with the D100 macro."
        data_tests: [not_null]
      - name: vehicle_class_norm
        description: "RUNT vehicle_class_norm, or 'excluded'."
        data_tests: [not_null]
      - name: decision_id
        description: "Decision that approved the row."
        data_tests: [not_null]

  - name: brand_alias
    description: "Brand alias (normalized) -> brand (normalized), applied first (D139). Only aliases observed in the sources. Attribution of the regional sources: Gobernacion de Boyaca em3d-hmim / Gobernacion de Risaralda x9pp-pcn5, CC BY-SA 4.0 (docs 08, ficha 9)."
    config:
      tags: [fleet_brand]
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [source_brand_norm]
    columns:
      - name: source_brand_norm
        description: "Brand as published, normalized (D100)."
        data_tests: [not_null]
      - name: brand_norm
        description: "Brand it stands for, normalized."
        data_tests: [not_null]
      - name: decision_id
        description: "Decision that approved the row."
        data_tests: [not_null]

  - name: auteco_line_brand_map
    description: "AUTECO is the distributor, not the brand: exact normalized line -> real brand (D139). 'SIN ASIGNAR' rows are explicit (no source of the brand); evidence is dato (documented), inferencia (inferred from the line name) or sin_evidencia. An AUTECO line not listed resolves to SIN ASIGNAR and warns. Origin: real AUTECO lines queried with SODA $group on 2026-10-14, classified with the mapping rules of docs/research/parque_por_marca.md. Attribution: CC BY-SA 4.0 (docs 08, ficha 9). It has 4 rows of difference against the Boyaca investigation (BAJAJ 5,276 vs 5,272; SIN ASIGNAR 499 vs 503), typos assigned to BAJAJ by inference (D141(b), Henry review pending)."
    config:
      tags: [fleet_brand]
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [line_norm]
    columns:
      - name: line_norm
        description: "Line as published, normalized (D100)."
        data_tests: [not_null]
      - name: real_brand
        description: "Real brand (normalized) or SIN ASIGNAR."
        data_tests: [not_null]
      - name: evidence
        description: "Basis of the assignment."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['dato', 'inferencia', 'sin_evidencia']
      - name: decision_id
        description: "Decision that approved the row."
        data_tests: [not_null]
