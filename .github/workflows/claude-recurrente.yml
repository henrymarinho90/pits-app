name: claude-recurrente

on:
  schedule:
    - cron: "0 12 * * 1"   # lunes 07:00 hora Colombia (UTC-5)
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  id-token: write

concurrency:
  group: claude-recurrente
  cancel-in-progress: false

jobs:
  auditoria-semanal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Auditoría semanal del repo. Solo lectura: no edites archivos.
            1. Compara docs/05_decisions_log.md y docs/06_status.md contra el código real.
               Lista contradicciones (decisión vigente que el código no cumple, status desactualizado).
            2. Lista TODO/FIXME, tests faltantes en módulos sin test y warnings de ruff.
            3. Propón los 3 siguientes pasos más pequeños según docs/06_status.md.
            Crea UN issue titulado "Auditoría semanal YYYY-MM-DD" con el resultado, en español.
          claude_args: |
            --max-turns 15
            --allowedTools "Read,Grep,Glob,Bash(ruff check:*),Bash(gh issue create:*)"
        env:
          GH_TOKEN: ${{ github.token }}
