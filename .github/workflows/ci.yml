# CI completo (Fase 5, D112-D116): lint/format/tests, job pg con Postgres efimero, migrate, seed
# sintetico, dbt build/freshness y verificacion de marts; job contract con SeaweedFS via compose (D115).
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/ci-contract] # TEMP: iterar sin PR; quitar antes del PR

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # uv sync lee .python-version (3.12) e instala el interprete si falta.
      - name: Sync dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest -q

      - name: dbt parse (offline)
        run: uv run pits transform parse

      - name: CLI smoke
        run: uv run pits version

  # Airflow tests (D94): proyecto uv aparte (Airflow fija su propio arbol de dependencias) y
  # solo en Linux, el unico host que soporta Airflow.
  orchestration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: orchestration/uv.lock

      - name: Sync dependencies
        run: uv sync --locked --project orchestration

      - name: Tests
        run: uv run --locked --project orchestration pytest orchestration/tests -q

  # Tests pg (D112): Postgres identico al de compose (misma imagen@digest y mismos initdb args,
  # vigilado por tests/test_ci_parity.py). Se arranca con `docker run` en un step (no `services:`)
  # porque las credenciales se generan en el job (D114) y un service container arrancaria antes.
  # Los contract tests (SeaweedFS) corren en el job contract (D115).
  pg:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PG_IMAGE: "postgres:17.11-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826"
      PG_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8 --locale-provider=builtin --builtin-locale=C.UTF-8"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync dependencies
        run: uv sync --locked

      - name: Assert no .env
        run: test ! -e .env

      # D114: credenciales efimeras solo para este job (el Postgres vive y muere con el runner).
      # `::add-mask::` antes de exportar; nada imprime valores. Formato D79: >=16 caracteres, sin
      # espacios. Contrasenas con token_urlsafe (A-Za-z0-9_-).
      - name: Generate ephemeral credentials
        run: |
          python3 - <<'PY'
          import os
          import secrets

          secrets_env = {
              "POSTGRES_PASSWORD": secrets.token_urlsafe(24),
              "PITS_PG_LOADER_PASSWORD": secrets.token_urlsafe(24),
              "PITS_PG_READER_PASSWORD": secrets.token_urlsafe(24),
              "PITS_PG_TRANSFORMER_PASSWORD": secrets.token_urlsafe(24),
          }
          plain_env = {
              "POSTGRES_USER": "pits_admin_ci",
              "POSTGRES_DB": "pits_ci",
              "PITS_PG_HOST": "127.0.0.1",
              "POSTGRES_HOST_PORT": "5433",
              "PITS_WAREHOUSE_DB": "pits_warehouse",
          }
          for name, value in secrets_env.items():
              assert len(value) >= 16, name
              print(f"::add-mask::{value}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              for name, value in {**plain_env, **secrets_env}.items():
                  fh.write(f"{name}={value}\n")
          PY

      # `-e NAME` sin valor reenvia la variable del entorno: el secreto no va en la linea de comandos.
      - name: Start Postgres (same image and initdb args as compose)
        run: |
          docker run -d --name pits-ci-postgres \
            --memory 1g --memory-swap 1g --shm-size 256m \
            -p 127.0.0.1:5433:5432 \
            -e POSTGRES_USER -e POSTGRES_PASSWORD -e POSTGRES_DB \
            -e POSTGRES_INITDB_ARGS="$PG_INITDB_ARGS" \
            "$PG_IMAGE"

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            if docker exec pits-ci-postgres pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"; then
              exit 0
            fi
            sleep 2
          done
          echo "Postgres did not become ready in 60s" >&2
          docker logs pits-ci-postgres 2>&1 | tail -n 30 >&2
          exit 1

      # Solo NOMBRES de variables PG*, nunca valores.
      - name: Diagnostics (PG variable names only)
        run: env | cut -d= -f1 | grep '^PG' || true

      - name: Tests pg
        run: uv run pytest -m "pg and not contract" -q --junitxml=pg-junit.xml

      # D113: pipeline de datos sobre el Postgres efimero (seed sintetico, nunca datos reales).
      - name: Migrate warehouse
        run: uv run pits db migrate

      - name: Seed synthetic landing data
        run: uv run python scripts/ci_seed_warehouse.py seed

      - name: dbt build
        run: uv run pits transform build

      - name: dbt source freshness
        run: uv run pits transform freshness

      - name: dbt build (idempotency)
        run: uv run pits transform build

      - name: Verify marts against the seed
        run: uv run python scripts/ci_seed_warehouse.py verify

      - name: Upload junit
        if: always()
        # upload-artifact no tiene post-step; los vacios evitan que la action reciba las contrasenas
        # de GITHUB_ENV. Los post-steps de checkout y setup-uv si heredan el env del job.
        env:
          POSTGRES_PASSWORD: ""
          PITS_PG_LOADER_PASSWORD: ""
          PITS_PG_READER_PASSWORD: ""
          PITS_PG_TRANSFORMER_PASSWORD: ""
        uses: actions/upload-artifact@v7
        with:
          name: pg-junit
          path: pg-junit.xml
          retention-days: 7
          if-no-files-found: warn

  # Contract tests (D115): SeaweedFS levantado con el docker-compose.yml real (misma imagen@digest,
  # s3.json y security.toml generados por compose). Secretos efimeros (D114), sin .env. Se excluyen los
  # contract marcados pg (`*_load_e2e`): necesitan Postgres + warehouse y los cubre el job pg.
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync dependencies
        run: uv sync --locked

      - name: Assert no .env
        run: test ! -e .env

      # D114/D104: formatos de .env.example. Access keys A-Za-z0-9 (hex mayuscula, distintas entre si),
      # secretos token_urlsafe (A-Za-z0-9_-, >=32). compose interpola TODO el archivo, asi que las
      # variables `:?` de postgres tambien se definen (valores dummy; postgres no se levanta).
      - name: Generate ephemeral credentials
        run: |
          python3 - <<'PY'
          import os
          import secrets

          access_keys = {
              "S3_ACCESS_KEY_ID": secrets.token_hex(16).upper(),
              "PITS_S3_WRITER_ACCESS_KEY_ID": secrets.token_hex(16).upper(),
              "PITS_S3_READER_ACCESS_KEY_ID": secrets.token_hex(16).upper(),
          }
          assert len(set(access_keys.values())) == 3
          secret_values = {
              "S3_SECRET_ACCESS_KEY": secrets.token_urlsafe(32),
              "PITS_S3_WRITER_SECRET_ACCESS_KEY": secrets.token_urlsafe(32),
              "PITS_S3_READER_SECRET_ACCESS_KEY": secrets.token_urlsafe(32),
              "PITS_SEAWEEDFS_FILER_JWT_KEY": secrets.token_urlsafe(48),
              "POSTGRES_PASSWORD": secrets.token_urlsafe(24),
          }
          plain_env = {
              "COMPOSE_PROFILES": "core",
              "S3_ENDPOINT_URL": "http://127.0.0.1:8333",
              "S3_REGION": "us-east-1",
              "S3_RAW_BUCKET": "pits-raw",
              "S3_NORMALIZED_BUCKET": "pits-normalized",
              "POSTGRES_USER": "pits_admin_ci",
              "POSTGRES_DB": "pits_ci",
          }
          sensitive = {**access_keys, **secret_values}
          for name, value in sensitive.items():
              assert len(value) >= 16, name
              print(f"::add-mask::{value}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              for name, value in {**plain_env, **sensitive}.items():
                  fh.write(f"{name}={value}\n")
          PY

      # SeaweedFS calcula el maximo de volumenes (-volume.max=0) segun el espacio libre y los tests
      # crean un bucket (coleccion) por caso: con el disco del runner casi lleno se agotan los volumenes
      # ("failed to find writable volume"). Se libera espacio de toolchains que el job no usa.
      - name: Free disk space
        run: |
          df -h / | tail -n 1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tail -n 1

      # Solo seaweedfs: el servicio postgres queda sin crear. --wait espera el healthcheck.
      - name: Start SeaweedFS (compose)
        run: docker compose up -d --wait seaweedfs

      # Solo NOMBRES de variables, nunca valores.
      - name: Diagnostics (variable names only)
        run: env | cut -d= -f1 | grep -E '^(S3_|PITS_S3_|PITS_SEAWEEDFS_|PITS_SWNET_|COMPOSE_)' || true

      # D104(c): policy write-once en raw y normalized.
      - name: Init storage buckets
        run: uv run pits storage init

      # `-m` de la linea de comandos reemplaza el de addopts. Red del probe D119: el compose se llama
      # `pits` (name:), asi que la red es pits_default, el default del test.
      - name: Contract tests
        run: uv run pytest -m "contract and not pg" -q --junitxml=contract-junit.xml

      - name: SeaweedFS volume status on failure
        if: failure()
        run: |
          docker exec pits-seaweedfs curl -fsS http://127.0.0.1:9333/dir/status | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['Topology']
          print({k: d.get(k) for k in ('Max', 'Free', 'Volumes')})
          " || true
          df -h / | tail -n 1

      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 40 seaweedfs 2>&1 | grep -viE 'secret|key' || true

      - name: Upload junit
        if: always()
        # Ver job pg: los vacios evitan que la action reciba los secretos de GITHUB_ENV.
        env:
          S3_ACCESS_KEY_ID: ""
          S3_SECRET_ACCESS_KEY: ""
          PITS_S3_WRITER_ACCESS_KEY_ID: ""
          PITS_S3_WRITER_SECRET_ACCESS_KEY: ""
          PITS_S3_READER_ACCESS_KEY_ID: ""
          PITS_S3_READER_SECRET_ACCESS_KEY: ""
          PITS_SEAWEEDFS_FILER_JWT_KEY: ""
          POSTGRES_PASSWORD: ""
        uses: actions/upload-artifact@v7
        with:
          name: contract-junit
          path: contract-junit.xml
          retention-days: 7
          if-no-files-found: warn

      # Runner efimero: borrar contenedor y volumen es seguro aqui.
      - name: Compose down
        if: always()
        run: docker compose down -v
