# CI minimo como habilitador (D49). CI completo con dbt build en Fase 5.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # uv sync lee .python-version (3.12) e instala el interprete si falta.
      - name: Sync dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest -q

      - name: dbt parse (offline)
        run: uv run pits transform parse

      - name: CLI smoke
        run: uv run pits version

  # Airflow tests (D94): proyecto uv aparte (Airflow fija su propio arbol de dependencias) y
  # solo en Linux, el unico host que soporta Airflow.
  orchestration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: orchestration/uv.lock

      - name: Sync dependencies
        run: uv sync --locked --project orchestration

      - name: Tests
        run: uv run --locked --project orchestration pytest orchestration/tests -q
