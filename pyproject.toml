[project]
name = "pits-app"
version = "0.1.0"
description = "Data platform for an auto/moto parts marketplace"
requires-python = ">=3.12,<3.13"
dependencies = ["typer>=0.27"]

[project.scripts]
pits = "pits.cli:app"

[dependency-groups]
dev = [
    "boto3>=1.43.111",
    "pytest>=8",
    "ruff>=0.17",
]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pits"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests/contract"]
addopts = "-ra --strict-markers --strict-config -m 'not contract'"
markers = ["contract: needs a live S3 endpoint (S3_ENDPOINT_URL); excluded by default"]
xfail_strict = true
