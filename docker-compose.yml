name: pits

# Stack local de Pits. Servicios con profile "core"; se activan con COMPOSE_PROFILES=core (ver .env.example).
# docker-compose.spike.yml se conserva aparte y comparte el puerto 8333: no levantar ambos a la vez.

services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    container_name: pits-seaweedfs
    profiles: ["core"]
    # El entrypoint antepone -dir=/data -volume.max=0 -master.volumeSizeLimitMB=1024.
    # Identidades S3 (D104): desde el config s3.json de abajo. NO definir AWS_ACCESS_KEY_ID /
    # AWS_SECRET_ACCESS_KEY aqui: weed 4.48 las sigue aceptando como admin ADICIONAL aunque haya
    # s3.json (verificado en sonda), lo que anularia el aislamiento writer/reader.
    command: ["server", "-s3", "-s3.config=/etc/seaweedfs/s3.json"]
    configs:
      - source: seaweedfs_s3
        target: /etc/seaweedfs/s3.json
    environment:
      GOMEMLIMIT: 500MiB # (D63)
    mem_limit: 768m
    memswap_limit: 768m
    restart: unless-stopped
    ports:
      # Solo S3 y solo loopback en el host. Master (9333) y filer (8888) NO se publican, pero responden sin
      # autenticacion a cualquier contenedor de la red Docker pits_default (riesgo abierto, decide Henry).
      - "127.0.0.1:8333:8333"
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  postgres:
    # postgres 17.11 (PG_VERSION=17.11-1.pgdg12+2) Debian bookworm; digest = índice multi-arch (docker pull + imagetools inspect).
    image: postgres:17.11-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    container_name: pits-postgres
    profiles: ["core"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      # Solo aplica al primer initdb del volumen: UTF8 + colacion builtin C.UTF-8 (busqueda sin tildes via unaccent en dbt).
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8 --locale-provider=builtin --builtin-locale=C.UTF-8"
    mem_limit: 1g
    memswap_limit: 1g
    shm_size: 256m
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      # La imagen declara VOLUME /var/lib/postgresql/data (PGDATA identico).
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

# Config S3 de SeaweedFS (D104). Se genera en `docker compose up` desde .env: ningun secreto
# se versiona ni queda en un archivo del host (requiere Compose >= 2.23.1 por `content:`).
# Formato weed/pb/iam.proto: acciones globales (Admin, Read, ...) o por bucket (Read:<bucket>).
# Valores validados por pits (writer/reader) o libres de comillas, barras y "$" (admin): ver .env.example.
configs:
  seaweedfs_s3:
    content: |
      {
        "identities": [
          {
            "name": "pits_admin",
            "credentials": [
              {"accessKey": "${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}", "secretKey": "${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}"}
            ],
            "actions": ["Admin", "Read", "List", "Tagging", "Write"]
          },
          {
            "name": "pits_writer",
            "credentials": [
              {"accessKey": "${PITS_S3_WRITER_ACCESS_KEY_ID:?set PITS_S3_WRITER_ACCESS_KEY_ID in .env}", "secretKey": "${PITS_S3_WRITER_SECRET_ACCESS_KEY:?set PITS_S3_WRITER_SECRET_ACCESS_KEY in .env}"}
            ],
            "actions": [
              "Read:${S3_RAW_BUCKET:?set S3_RAW_BUCKET in .env}", "List:${S3_RAW_BUCKET}", "Write:${S3_RAW_BUCKET}",
              "Read:${S3_NORMALIZED_BUCKET:-pits-normalized}", "List:${S3_NORMALIZED_BUCKET:-pits-normalized}", "Write:${S3_NORMALIZED_BUCKET:-pits-normalized}"
            ]
          },
          {
            "name": "pits_reader",
            "credentials": [
              {"accessKey": "${PITS_S3_READER_ACCESS_KEY_ID:?set PITS_S3_READER_ACCESS_KEY_ID in .env}", "secretKey": "${PITS_S3_READER_SECRET_ACCESS_KEY:?set PITS_S3_READER_SECRET_ACCESS_KEY in .env}"}
            ],
            "actions": [
              "Read:${S3_RAW_BUCKET}", "List:${S3_RAW_BUCKET}",
              "Read:${S3_NORMALIZED_BUCKET:-pits-normalized}", "List:${S3_NORMALIZED_BUCKET:-pits-normalized}"
            ]
          }
        ]
      }

volumes:
  seaweedfs_data:
    name: pits_seaweedfs_data
  postgres_data:
    name: pits_postgres_data
